# Publishes to PyPI when a GitHub release is published (PyPI trusted publishing, no API token).
# One-time setup on pypi.org: add a trusted publisher for project "consent-check" with
# owner okohlbacher, repository consent-check, workflow publish.yml, environment pypi.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
