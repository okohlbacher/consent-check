name: test
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_consent_check.py
      - run: python3 consent_deid.py --selftest
      - run: python3 consent_check.py --no-hl7 mii-consent-2025.0.1/examples
