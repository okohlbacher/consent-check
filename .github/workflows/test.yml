name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_genomde_consent_check.py
      - run: python -m genomde_consent_check.deid --selftest
      - run: python -m genomde_consent_check --no-hl7 genomde_consent_check/data/mii-consent-2025.0.1/examples
      - name: build and install the package, run the installed commands
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          genomde-consent-check --version
          genomde-consent-deid --selftest
          genomde-consent-check --no-hl7 "$GITHUB_WORKSPACE/genomde_consent_check/data/mii-consent-2025.0.1/examples"
