name: test
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_consent_check.py
      - run: python consent_deid.py --selftest
      - run: python consent_check.py --no-hl7 mii-consent-2025.0.1/examples
