[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomde-consent-check"
dynamic = ["version"]
description = "Check MII Kerndatensatz Consent (FHIR R4) resources: IG rules, official HL7 validator, cross-export consistency; plus de-identification"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "genomde_consent_check/data/mii-consent-2025.0.1/NOTICE.md"]
authors = [{ name = "Oliver Kohlbacher" }]
keywords = ["FHIR", "MII", "Kerndatensatz", "consent", "validation", "medical informatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/okohlbacher/genomde-consent-check"
Issues = "https://github.com/okohlbacher/genomde-consent-check/issues"

[project.scripts]
genomde-consent-check = "genomde_consent_check.checker:main"
genomde-consent-deid = "genomde_consent_check.deid:cli"

[tool.setuptools]
packages = ["genomde_consent_check"]

[tool.setuptools.dynamic]
version = { attr = "genomde_consent_check.__version__" }

[tool.setuptools.package-data]
genomde_consent_check = ["data/mii-consent-2025.0.1/*.json", "data/mii-consent-2025.0.1/*.md", "data/mii-consent-2025.0.1/examples/*.json"]
